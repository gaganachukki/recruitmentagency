    <!-- 404 Error Section -->
    <section class="section page-header" style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: var(--bg-color); margin: 0; padding: 20px; text-align: center;">
        <div class="container">
            <h1 style="font-size: 8rem; font-weight: 800; color: var(--primary); line-height: 1; margin-bottom: 20px; font-family: 'Outfit', sans-serif;">404!</h1>
            <h2 style="font-size: 2.5rem; color: var(--secondary); margin-bottom: 20px; font-family: 'Outfit', sans-serif;">Page Not Found</h2>
            <p style="font-size: 1.1rem; color: var(--text-muted); max-width: 600px; margin: 0 auto 40px; line-height: 1.6;">

                <a href="index.html" class="btn btn-primary" style="padding: 15px 30px; font-weight: 600;">Return to Homepage</a>
                <a href="jobs.html" class="btn btn-outline" style="padding: 15px 30px; font-weight: 600;">Browse Open Jobs</a>
            </div>
        </div>
    </section>
